name: CI/CD Pipeline — CSVCleaner Pro

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # ===== JOB 1: TEST =====
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask==3.0.0 pandas==2.2.0 numpy==1.26.4 pytest==7.4.0 openpyxl==3.1.2

      - name: Create data folder
        run: mkdir -p data

      - name: Run tests
        run: pytest tests/ -v

  # ===== JOB 2: BUILD =====
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t csvcleanerpro .

      - name: Check image
        run: docker images

  # ===== JOB 3: DEPLOY =====
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy
        run: |
          echo "✅ All tests passed!"
          echo "✅ Docker image built!"
          echo "🚀 Deploying to Render.com..."
          echo "Pipeline complete!"